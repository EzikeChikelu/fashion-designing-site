<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tickerboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one slim header, a summary band, then a dense sortable table where the sparkline column carries the visual weight. */
:root{
  --bg:#f0f2f6; --panel:#ffffff; --panel-2:#f6f7fa; --line:#dde1e9; --fg:#12161d; --mute:#5a6372;
  --accent:#3946c9; --accent-soft:rgba(57,70,201,.10);
  --up:#0c8559; --up-soft:rgba(12,133,89,.13); --down:#cc2f46; --down-soft:rgba(204,47,70,.13);
  --shadow:0 1px 2px rgba(18,22,29,.05),0 8px 24px rgba(18,22,29,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1017; --panel:#141a24; --panel-2:#10151e; --line:#233043; --fg:#e8ecf3; --mute:#8d98aa;
  --accent:#93a3ff; --accent-soft:rgba(147,163,255,.14);
  --up:#3fdc9b; --up-soft:rgba(63,220,155,.14); --down:#ff6d81; --down-soft:rgba(255,109,129,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1017; --panel:#141a24; --panel-2:#10151e; --line:#233043; --fg:#e8ecf3; --mute:#8d98aa;
  --accent:#93a3ff; --accent-soft:rgba(147,163,255,.14);
  --up:#3fdc9b; --up-soft:rgba(63,220,155,.14); --down:#ff6d81; --down-soft:rgba(255,109,129,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{font:700 22px/1 var(--f-display);letter-spacing:-.01em;margin:0}
.brand p{margin:3px 0 0;color:var(--mute);font-size:12.5px}
.status{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 10px;font-size:12.5px;box-shadow:var(--shadow)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.status.live .dot{background:var(--up);animation:pulse 2s infinite}
.status.demo .dot{background:#d79a1f}
.status.err .dot{background:var(--down)}
.ring{width:22px;height:22px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2.5}
.ring .track{stroke:var(--line)}
.ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.status small{color:var(--mute);font-family:var(--f-mono);font-size:11.5px}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--up-soft)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* summary band */
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.sum{padding:14px 18px;min-width:0;display:flex;flex-direction:column;gap:4px}
.sum + .sum{border-left:1px solid var(--line)}
.sum span{color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em}
.sum b{font:500 19px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum em{font:normal 12.5px var(--f-mono);font-variant-numeric:tabular-nums}

/* toolbar */
.toolbar{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;color:var(--mute);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg button:hover{color:var(--fg)}
.search{flex:1 1 180px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:9px 0;outline:none}
.search:focus-within{border-color:var(--accent)}
.search svg{color:var(--mute);flex:none}
.spacer{flex:1 1 0}

/* table */
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:11px 12px;text-align:right;white-space:nowrap}
th:nth-child(3),td:nth-child(3){text-align:left}
th{font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);background:var(--panel-2);border-bottom:1px solid var(--line);padding-block:10px}
th button{background:none;border:0;padding:0;color:inherit;font:inherit;text-transform:inherit;letter-spacing:inherit;display:inline-flex;gap:4px;align-items:center}
th button:hover,th[aria-sort="ascending"] button,th[aria-sort="descending"] button{color:var(--fg)}
th[aria-sort="ascending"] button::after{content:"▲";font-size:8px}
th[aria-sort="descending"] button::after{content:"▼";font-size:8px}
td{border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--panel-2)}
td.rank{color:var(--mute);font-family:var(--f-mono);width:36px;text-align:center}
td.act,th.act{width:40px;padding-inline:4px;text-align:center}
.coin{display:flex;align-items:center;gap:10px;min-width:0}
.badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--f-display);color:#fff;flex:none;letter-spacing:.02em}
.coin b{font-weight:600;display:block;line-height:1.2}
.coin small{color:var(--mute);font-family:var(--f-mono);font-size:11.5px}
td.price{font:500 14.5px var(--f-mono);font-variant-numeric:tabular-nums}
.chg{display:inline-block;min-width:68px;padding:3px 8px;border-radius:7px;font:500 12.5px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.chg.up{background:var(--up-soft)} .chg.down{background:var(--down-soft)} .chg.flat{background:var(--panel-2);color:var(--mute)}
td.spark{width:150px}
td.spark svg{display:block;margin-left:auto;overflow:visible}
.ico{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--mute);display:inline-grid;place-items:center}
.ico:hover{background:var(--accent-soft);color:var(--accent)}
.ico.on{color:var(--accent)}
.ico.star.on{color:#d79a1f}
.flash-up{animation:fup 1.3s ease-out}
.flash-down{animation:fdown 1.3s ease-out}
@keyframes fup{0%{background:var(--up-soft);color:var(--up)}100%{background:transparent}}
@keyframes fdown{0%{background:var(--down-soft);color:var(--down)}100%{background:transparent}}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}
.foot{color:var(--mute);font-size:12px;margin:0;max-width:78ch}

/* alert sheet + toasts */
.sheet{position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow),0 0 0 1px rgba(0,0,0,.02);padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet h2{font:700 16px var(--f-display);margin:0}
.sheet p{margin:0;color:var(--mute);font-size:12.5px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--mute)}
.field input{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--f-mono);outline:none}
.field input:focus{border-color:var(--accent)}
.row{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.toasts{position:fixed;z-index:30;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100vw - 32px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;animation:in .25s ease-out}
.toast b{display:block}
.toast span{color:var(--mute);font-size:12.5px}
@keyframes in{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}

@media (max-width:760px){
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sum:nth-child(3){border-left:0}
  .sum:nth-child(n+3){border-top:1px solid var(--line)}
  .spacer{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="var(--accent)"/><path d="M6 23l6-7 5 4 6-9 5 6" fill="none" stroke="var(--panel)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="28" cy="17" r="2.4" fill="var(--panel)"/></svg>
      <div><h1>Tickerboard</h1><p>Crypto prices with 7-day sparklines</p></div>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">
      <i class="dot"></i><span id="statusText">Connecting…</span>
      <svg class="ring" viewBox="0 0 24 24" aria-hidden="true"><circle class="track" cx="12" cy="12" r="9"/><circle class="bar" id="ringBar" cx="12" cy="12" r="9" stroke-dasharray="56.55" stroke-dashoffset="0"/></svg>
      <small id="countdown">--s</small>
    </div>
  </header>

  <section class="summary" id="summary" aria-label="Market summary"></section>

  <div class="toolbar">
    <div class="seg" id="tabs" role="group" aria-label="View">
      <button data-tab="all" aria-pressed="true">All</button>
      <button data-tab="watch" aria-pressed="false">Watchlist <span id="watchCount" class="mono">0</span></button>
    </div>
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search coin or symbol" autocomplete="off"></label>
    <div class="spacer"></div>
    <div class="seg" id="curs" role="group" aria-label="Currency">
      <button data-cur="usd" aria-pressed="true">USD</button>
      <button data-cur="ngn" aria-pressed="false">NGN</button>
      <button data-cur="eur" aria-pressed="false">EUR</button>
    </div>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr>
        <th class="act"><span class="sr" style="position:absolute;left:-9999px">Watch</span></th>
        <th><button data-sort="rank">#</button></th>
        <th><button data-sort="name">Coin</button></th>
        <th><button data-sort="price">Price</button></th>
        <th><button data-sort="ch1">1h</button></th>
        <th><button data-sort="ch24">24h</button></th>
        <th><button data-sort="ch7">7d</button></th>
        <th>Last 7 days</th>
        <th><button data-sort="mcap">Market cap</button></th>
        <th class="act"><span style="position:absolute;left:-9999px">Alert</span></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <p class="foot" id="foot">Prices from the free CoinGecko API, refreshed every 30 seconds. Green and red show the direction of the last change. Alerts only fire while this page is open. Not financial advice.</p>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-labelledby="sheetTitle">
  <h2 id="sheetTitle">Price alert</h2>
  <p id="sheetNow"></p>
  <div class="field"><label for="aAbove">Notify when price rises to</label><input id="aAbove" type="number" step="any" min="0" inputmode="decimal" placeholder="e.g. 70000"></div>
  <div class="field"><label for="aBelow">Notify when price falls to</label><input id="aBelow" type="number" step="any" min="0" inputmode="decimal" placeholder="e.g. 55000"></div>
  <div class="row"><button class="btn pri" id="aSave">Save alert</button><button class="btn" id="aClear">Clear</button><button class="btn" id="aClose">Close</button></div>
</div>
<div class="toasts" id="toasts" aria-live="assertive"></div>

<script>
(function(){
  var REFRESH_MS = 30000, DEMO_TICK_MS = 2500;
  var $ = function(s){return document.querySelector(s)};
  var store = {
    get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
    set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  };

  var state = {
    rows:[], prev:{}, cur:store.get('tb.cur','usd'), tab:'all', q:'',
    sort:{key:'rank',dir:1}, watch:store.get('tb.watch',['bitcoin','ethereum','solana']),
    alerts:store.get('tb.alerts',{}), demo:false, loading:false, nextAt:Date.now()+REFRESH_MS,
    backoffUntil:0, alertFor:null, hasData:false
  };

  /* demo seed: illustrative values only, shown when the live feed can't be reached */
  var DEMO = [
    ['bitcoin','btc','Bitcoin',68000,1.34e12],['ethereum','eth','Ethereum',3400,4.1e11],
    ['tether','usdt','Tether',1,1.1e11],['binancecoin','bnb','BNB',590,8.6e10],
    ['solana','sol','Solana',165,7.6e10],['ripple','xrp','XRP',0.52,2.9e10],
    ['usd-coin','usdc','USDC',1,3.3e10],['cardano','ada','Cardano',0.45,1.6e10],
    ['dogecoin','doge','Dogecoin',0.16,2.3e10],['avalanche-2','avax','Avalanche',34,1.3e10],
    ['chainlink','link','Chainlink',14.2,8.4e9],['polkadot','dot','Polkadot',6.8,9.2e9]
  ];
  var RATE = {usd:1,ngn:1500,eur:0.92};

  function walk(end,n,vol){
    var a=[end],i; for(i=1;i<n;i++){a.unshift(a[0]/(1+(Math.random()-.5)*vol))}
    return a;
  }
  function seedDemo(){
    var r = RATE[state.cur]||1;
    state.rows = DEMO.map(function(d,i){
      var stable = d[3]===1, p = d[3]*r, sp = walk(p,168,stable?0.0006:0.012);
      var c7 = (sp[sp.length-1]/sp[0]-1)*100;
      return {id:d[0],sym:d[1].toUpperCase(),name:d[2],rank:i+1,price:p,mcap:d[4]*r,
        ch1:(Math.random()-.5)*(stable?.05:1.4),ch24:(sp[sp.length-1]/sp[Math.max(0,sp.length-25)]-1)*100,ch7:c7,spark:sp};
    });
  }
  function demoTick(){
    if(!state.demo||document.hidden) return;
    state.rows.forEach(function(r){
      var stable = r.price/(RATE[state.cur]||1) > .98 && r.price/(RATE[state.cur]||1) < 1.02 && r.sym.indexOf('US')===0;
      var f = 1+(Math.random()-.5)*(stable?0.0004:0.0035);
      r.price*=f; r.spark[r.spark.length-1]=r.price;
      r.ch24+= (f-1)*100; r.ch1+=(f-1)*100;
      r.ch7=(r.spark[r.spark.length-1]/r.spark[0]-1)*100;
    });
    afterData();
  }

  /* live data */
  function liveUrl(){
    return 'https://api.coingecko.com/api/v3/coins/markets?vs_currency='+state.cur+
      '&order=market_cap_desc&per_page=20&page=1&sparkline=true&price_change_percentage=1h,24h,7d';
  }
  function refresh(){
    if(state.loading) return;
    state.loading=true; state.nextAt=Date.now()+REFRESH_MS;
    var ctl = ('AbortController' in window)?new AbortController():null;
    var t = setTimeout(function(){ctl&&ctl.abort()},9000);
    fetch(liveUrl(),ctl?{signal:ctl.signal}:{}).then(function(res){
      if(res.status===429){state.backoffUntil=Date.now()+60000;throw new Error('rate')}
      if(!res.ok) throw new Error('http');
      return res.json();
    }).then(function(list){
      clearTimeout(t);
      if(!Array.isArray(list)||!list.length) throw new Error('empty');
      state.rows = list.map(function(c,i){
        var sp = (c.sparkline_in_7d&&c.sparkline_in_7d.price)||[];
        return {id:c.id,sym:(c.symbol||'').toUpperCase(),name:c.name,rank:c.market_cap_rank||i+1,
          price:c.current_price,mcap:c.market_cap,ch1:c.price_change_percentage_1h_in_currency,
          ch24:c.price_change_percentage_24h_in_currency!=null?c.price_change_percentage_24h_in_currency:c.price_change_percentage_24h,
          ch7:c.price_change_percentage_7d_in_currency,spark:sp};
      });
      state.demo=false; state.hasData=true; state.loading=false;
      setStatus('live','Live · CoinGecko');
      afterData();
    }).catch(function(err){
      clearTimeout(t); state.loading=false;
      if(!state.hasData || state.demo){
        if(!state.demo){seedDemo(); state.demo=true; state.hasData=true; state.prev={};}
        setStatus('demo','Demo data · live feed unreachable');
        afterData();
      } else {
        setStatus('err', err&&err.message==='rate'?'Rate limited · retrying':'Connection lost · retrying');
      }
    });
  }

  function setStatus(kind,text){
    var s=$('#status'); s.className='status '+kind; $('#statusText').textContent=text;
  }

  /* formatting */
  function money(v){
    if(v==null||isNaN(v)) return '–';
    var d = v>=1?2:(v>=0.01?4:6);
    try{return new Intl.NumberFormat('en-US',{style:'currency',currency:state.cur.toUpperCase(),minimumFractionDigits:d,maximumFractionDigits:d}).format(v)}
    catch(e){return v.toFixed(d)}
  }
  function compact(v){
    if(v==null||isNaN(v)) return '–';
    try{return new Intl.NumberFormat('en-US',{style:'currency',currency:state.cur.toUpperCase(),notation:'compact',maximumFractionDigits:2}).format(v)}
    catch(e){return String(Math.round(v))}
  }
  function pct(v){
    if(v==null||isNaN(v)) return '<span class="chg flat">–</span>';
    var cls = Math.abs(v)<0.005?'flat':(v>0?'up':'down');
    return '<span class="chg '+cls+'">'+(v>0?'+':'')+v.toFixed(2)+'%</span>';
  }
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function hue(s){var h=0,i;for(i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}

  function spark(r){
    var d=r.spark; if(!d||d.length<2) return '';
    var w=132,h=36,pad=3,min=Infinity,max=-Infinity,i;
    for(i=0;i<d.length;i++){if(d[i]<min)min=d[i];if(d[i]>max)max=d[i]}
    var span=(max-min)||1, n=d.length-1, pts=[];
    for(i=0;i<d.length;i++){pts.push([ (i/n)*w, pad+(h-pad*2)*(1-(d[i]-min)/span) ])}
    var line=pts.map(function(p,j){return (j?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join('');
    var area=line+'L'+w+' '+h+'L0 '+h+'Z';
    var up=d[d.length-1]>=d[0], cls=up?'up':'down', last=pts[pts.length-1], gid='g'+r.id.replace(/[^a-z0-9]/gi,'');
    return '<svg class="'+cls+'" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="7 day price trend, '+(up?'up':'down')+'">'+
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".28"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>'+
      '<path d="'+area+'" fill="url(#'+gid+')"/>'+
      '<path d="'+line+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>'+
      '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2.6" fill="currentColor"/></svg>';
  }

  var STAR='<svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.8 6.3.7-4.7 4.3 1.3 6.2L12 17l-5.6 3 1.3-6.2L3 9.5l6.3-.7z"/></svg>';
  var BELL='<svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0112 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 004 0"/></svg>';

  /* rendering */
  function visible(){
    var q=state.q.trim().toLowerCase();
    var list=state.rows.filter(function(r){
      if(state.tab==='watch'&&state.watch.indexOf(r.id)<0) return false;
      return !q||r.name.toLowerCase().indexOf(q)>=0||r.sym.toLowerCase().indexOf(q)>=0;
    });
    var k=state.sort.key, dir=state.sort.dir;
    list.sort(function(a,b){
      var x=a[k],y=b[k];
      if(typeof x==='string') return x.localeCompare(y)*dir;
      if(x==null) return 1; if(y==null) return -1;
      return (x-y)*dir;
    });
    return list;
  }
  function renderRows(){
    var list=visible(), html='';
    if(!list.length){
      $('#rows').innerHTML='<tr><td colspan="10" class="empty">'+(state.tab==='watch'?'Your watchlist is empty. Tap the star on any coin to track it here.':'No coins match your search.')+'</td></tr>';
      return;
    }
    list.forEach(function(r){
      var prev=state.prev[r.id], flash='';
      if(prev!=null&&r.price!==prev) flash=r.price>prev?' flash-up':' flash-down';
      var w=state.watch.indexOf(r.id)>=0, a=state.alerts[r.id], hasA=a&&(a.above!=null||a.below!=null);
      html+='<tr data-id="'+esc(r.id)+'">'+
        '<td class="act"><button class="ico star'+(w?' on':'')+'" data-act="star" aria-pressed="'+w+'" aria-label="'+(w?'Remove ':'Add ')+esc(r.name)+(w?' from':' to')+' watchlist">'+STAR.replace('<svg','<svg fill="'+(w?'currentColor':'none')+'"')+'</button></td>'+
        '<td class="rank">'+r.rank+'</td>'+
        '<td><div class="coin"><span class="badge" style="background:hsl('+hue(r.id)+' 52% 42%)">'+esc(r.sym.slice(0,3))+'</span><div><b>'+esc(r.name)+'</b><small>'+esc(r.sym)+'</small></div></div></td>'+
        '<td class="price'+flash+'">'+money(r.price)+'</td>'+
        '<td>'+pct(r.ch1)+'</td><td>'+pct(r.ch24)+'</td><td>'+pct(r.ch7)+'</td>'+
        '<td class="spark">'+spark(r)+'</td>'+
        '<td class="mono">'+compact(r.mcap)+'</td>'+
        '<td class="act"><button class="ico'+(hasA?' on':'')+'" data-act="bell" aria-label="Price alert for '+esc(r.name)+'">'+BELL.replace('<svg','<svg fill="'+(hasA?'currentColor':'none')+'"')+'</button></td>'+
      '</tr>';
    });
    $('#rows').innerHTML=html;
  }
  function renderSummary(){
    var rows=state.rows; if(!rows.length){$('#summary').innerHTML='';return}
    var cap=rows.reduce(function(s,r){return s+(r.mcap||0)},0);
    var withCh=rows.filter(function(r){return r.ch24!=null});
    var top=withCh.slice().sort(function(a,b){return b.ch24-a.ch24})[0];
    var low=withCh.slice().sort(function(a,b){return a.ch24-b.ch24})[0];
    var wl=rows.filter(function(r){return state.watch.indexOf(r.id)>=0&&r.ch24!=null});
    var avg=wl.length?wl.reduce(function(s,r){return s+r.ch24},0)/wl.length:null;
    function tile(label,main,sub){return '<div class="sum"><span>'+label+'</span><b>'+main+'</b><em>'+sub+'</em></div>'}
    $('#summary').innerHTML=
      tile('Tracked market cap',compact(cap),'<span class="mono" style="color:var(--mute)">top '+rows.length+' coins</span>')+
      tile('Top gainer, 24h',top?esc(top.sym):'–',top?pct(top.ch24):'')+
      tile('Top loser, 24h',low?esc(low.sym):'–',low?pct(low.ch24):'')+
      tile('Your watchlist',wl.length+' coin'+(wl.length===1?'':'s'),avg==null?'<span style="color:var(--mute)">star a coin to track it</span>':pct(avg)+' <span style="color:var(--mute)">avg 24h</span>');
  }
  function renderHeads(){
    document.querySelectorAll('th').forEach(function(th){
      var b=th.querySelector('button[data-sort]');
      if(!b){return}
      th.setAttribute('aria-sort',b.dataset.sort===state.sort.key?(state.sort.dir>0?'ascending':'descending'):'none');
    });
    $('#watchCount').textContent=state.watch.length;
  }
  function afterData(){
    checkAlerts(); renderSummary(); renderRows(); renderHeads();
    state.rows.forEach(function(r){state.prev[r.id]=r.price});
  }

  /* alerts */
  function toast(title,body){
    var el=document.createElement('div'); el.className='toast';
    el.innerHTML='<b>'+esc(title)+'</b><span>'+esc(body)+'</span>';
    $('#toasts').appendChild(el); setTimeout(function(){el.remove()},9000);
  }
  function checkAlerts(){
    var changed=false;
    state.rows.forEach(function(r){
      var a=state.alerts[r.id]; if(!a) return;
      if(a.above!=null&&r.price>=a.above){toast(r.name+' rose to '+money(a.above),'Now '+money(r.price));a.above=null;changed=true}
      if(a.below!=null&&r.price<=a.below){toast(r.name+' fell to '+money(a.below),'Now '+money(r.price));a.below=null;changed=true}
      if(a.above==null&&a.below==null){delete state.alerts[r.id]}
    });
    if(changed) store.set('tb.alerts',state.alerts);
  }
  function openSheet(id){
    var r=state.rows.filter(function(x){return x.id===id})[0]; if(!r) return;
    state.alertFor=id; var a=state.alerts[id]||{};
    $('#sheetTitle').textContent=r.name+' alert';
    $('#sheetNow').textContent='Now '+money(r.price)+' ('+state.cur.toUpperCase()+')';
    $('#aAbove').value=a.above!=null?a.above:''; $('#aBelow').value=a.below!=null?a.below:'';
    $('#sheet').hidden=false; $('#aAbove').focus();
  }
  function closeSheet(){$('#sheet').hidden=true;state.alertFor=null}
  function num(v){var n=parseFloat(v);return isFinite(n)&&n>0?n:null}

  /* events */
  $('#rows').addEventListener('click',function(e){
    var b=e.target.closest('button[data-act]'); if(!b) return;
    var id=b.closest('tr').dataset.id;
    if(b.dataset.act==='star'){
      var i=state.watch.indexOf(id); if(i<0) state.watch.push(id); else state.watch.splice(i,1);
      store.set('tb.watch',state.watch); renderSummary(); renderRows(); renderHeads();
    } else openSheet(id);
  });
  document.querySelector('thead').addEventListener('click',function(e){
    var b=e.target.closest('button[data-sort]'); if(!b) return;
    var k=b.dataset.sort;
    if(state.sort.key===k) state.sort.dir*=-1; else {state.sort.key=k;state.sort.dir=(k==='rank'||k==='name')?1:-1}
    renderRows(); renderHeads();
  });
  $('#tabs').addEventListener('click',function(e){
    var b=e.target.closest('button[data-tab]'); if(!b) return;
    state.tab=b.dataset.tab;
    document.querySelectorAll('#tabs button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
    renderRows();
  });
  $('#curs').addEventListener('click',function(e){
    var b=e.target.closest('button[data-cur]'); if(!b||b.dataset.cur===state.cur) return;
    state.cur=b.dataset.cur; store.set('tb.cur',state.cur);
    state.alerts={}; store.set('tb.alerts',state.alerts); state.prev={}; closeSheet();
    document.querySelectorAll('#curs button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});
    if(state.demo){seedDemo();afterData()}
    state.backoffUntil=0; refresh();
  });
  $('#q').addEventListener('input',function(e){state.q=e.target.value;renderRows()});
  $('#aSave').addEventListener('click',function(){
    if(!state.alertFor) return;
    var a={above:num($('#aAbove').value),below:num($('#aBelow').value)};
    if(a.above==null&&a.below==null) delete state.alerts[state.alertFor]; else state.alerts[state.alertFor]=a;
    store.set('tb.alerts',state.alerts);
    var r=state.rows.filter(function(x){return x.id===state.alertFor})[0];
    toast('Alert saved',(r?r.name:'')+' will notify you while this page is open.');
    closeSheet(); renderRows();
  });
  $('#aClear').addEventListener('click',function(){
    if(state.alertFor){delete state.alerts[state.alertFor];store.set('tb.alerts',state.alerts)}
    closeSheet(); renderRows();
  });
  $('#aClose').addEventListener('click',closeSheet);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden) closeSheet()});

  /* countdown ring + scheduler */
  var C=56.55;
  setInterval(function(){
    var left=Math.max(0,state.nextAt-Date.now()), frac=left/REFRESH_MS;
    $('#ringBar').style.strokeDashoffset=String(C*(1-frac));
    $('#countdown').textContent=Math.ceil(left/1000)+'s';
    if(left===0&&!document.hidden&&Date.now()>=state.backoffUntil) refresh();
    else if(left===0) state.nextAt=Date.now()+2000;
  },250);
  setInterval(demoTick,DEMO_TICK_MS);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()>state.nextAt) state.nextAt=Date.now()});

  /* boot: restore currency selection, first paint in demo state so the page is never empty */
  document.querySelectorAll('#curs button').forEach(function(x){x.setAttribute('aria-pressed',x.dataset.cur===state.cur)});
  seedDemo(); state.demo=true; setStatus('demo','Loading live prices…'); renderSummary(); renderRows(); renderHeads();
  refresh();
})();
</script>

</body>
</html>
